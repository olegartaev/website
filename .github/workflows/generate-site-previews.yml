name: Generate site previews

on:
  push:
    branches: [main]
    paths:
      - "assets/field-sampling.webp"
      - "assets/habitat-mountain.webp"
      - "assets/habitat-forest.webp"
      - "assets/live-imaging-phoxinus-isetensis.jpg"
      - "assets/live-imaging-barbatula-sp.jpg"
      - "scripts/generate_site_previews.py"
      - ".github/workflows/generate-site-previews.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-previews
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate high-quality previews
        run: python scripts/generate_site_previews.py
      - name: Commit previews when changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets/previews)" ]; then
            echo "Previews are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews
          git commit -m "Generate high-quality site previews"
          git push
