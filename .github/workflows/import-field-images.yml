name: Import fieldwork images

on:
  push:
    branches: [main]
    paths:
      - ".staging/field-images/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct fieldwork images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat .staging/field-images/field-sampling-riverbank.part* | tr -d '\n\r ' | base64 -d > assets/field-sampling-riverbank.webp
          cat .staging/field-images/field-camp-aerial.part* | tr -d '\n\r ' | base64 -d > assets/field-camp-aerial.webp
          cat .staging/field-images/field-basecamp-mountains.part* | tr -d '\n\r ' | base64 -d > assets/field-basecamp-mountains.webp
          cat .staging/field-images/field-river-landscape-aerial.part* | tr -d '\n\r ' | base64 -d > assets/field-river-landscape-aerial.webp
          echo "f60a20211d987c80293522a38bd85abec48f3a9a1f3137c89b18d9cd82651eea  assets/field-sampling-riverbank.webp" | sha256sum -c -
          echo "82084882f9eab37a21a1a281824c1b1323a09faed9cb649ce3a99d1f79f8c0f4  assets/field-camp-aerial.webp" | sha256sum -c -
          echo "47cae264ffffae038fc9a33b23635b28270191ddd96614c1b140441ab7edf294  assets/field-basecamp-mountains.webp" | sha256sum -c -
          echo "31640f89b846391ef3827a3f86d5994bfc06a3577c928c12a74663a762bbbf86  assets/field-river-landscape-aerial.webp" | sha256sum -c -
      - name: Commit images and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging/field-images
          rm -f .github/workflows/import-field-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add selected fieldwork photographs"
          git push
