name: Import fieldwork images

on:
  push:
    branches: [main]
    paths:
      - ".staging/field-images/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/previews
          cat .staging/field-images/field-river-meander.jpg.part* | tr -d '\n\r ' | base64 -d > assets/field-river-meander.jpg
          cat .staging/field-images/field-river-meander.webp.part* | tr -d '\n\r ' | base64 -d > assets/previews/field-river-meander.webp
          cat .staging/field-images/field-vehicle-nets.jpg.part* | tr -d '\n\r ' | base64 -d > assets/field-vehicle-nets.jpg
          cat .staging/field-images/field-vehicle-nets.webp.part* | tr -d '\n\r ' | base64 -d > assets/previews/field-vehicle-nets.webp

          echo "ffc3879df1085e97e11738c273e25b1de284eb317e05caf3a6e76d7bf329a97b  assets/field-river-meander.jpg" | sha256sum -c -
          echo "03ab77d2e3642bac2b228b8369db04a97f4b587afb87b35a9e24b4dfa34ea5b4  assets/previews/field-river-meander.webp" | sha256sum -c -
          echo "becc9b326457b5a38e7a3e720cb5561005db83e212d816bdb5c355460f9453e5  assets/field-vehicle-nets.jpg" | sha256sum -c -
          echo "b70146f79f9d663bc8a9ce3ce634da46913229d9553dc6e4f5078fb2bed6fdb9  assets/previews/field-vehicle-nets.webp" | sha256sum -c -

      - name: Commit images and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging/field-images
          rm -f .github/workflows/import-field-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add selected fieldwork photographs"
          git push
