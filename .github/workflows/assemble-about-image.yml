name: Assemble About photo

on:
  push:
    paths:
      - 'preview/.assemble-about'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct original JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat preview/.about-parts/part-*.txt | base64 --decode > preview/assets/about-field-alt.jpg
          echo "d52a909455a2ab7683d6daabc3273dcc2a97a042078ba1c76866cd4181e2c52a  preview/assets/about-field-alt.jpg" | sha256sum -c -
          rm -rf preview/.about-parts preview/.assemble-about
      - name: Commit reconstructed photo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/about-field-alt.jpg preview/.about-parts preview/.assemble-about
          git commit -m "Add original About field photo"
          git push
